[project]
name = "data-may-cry-worker"
version = "0.1.0"
description = "Data May Cry worker: MERRA-2 download, trend tests, packaging"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "jsonschema>=4",
    "earthaccess>=0.19.0",
    "xarray>=2026.9.0",
    "h5netcdf>=1.8.3",
    "netcdf4>=1.7.5.1.post1",
    "scipy>=1.18.1",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "duckdb>=2.0.0",
    "boto3>=1.43.117",
    "pymannkendall>=1.4.3",
    "geopandas>=1.2.0",
    "shapely>=2.2.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
